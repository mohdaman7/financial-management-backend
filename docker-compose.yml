version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skyfall-financial-api
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/financial_management
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-skyfall_prod_jwt_access_secret_key_32_chars_min}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-skyfall_prod_jwt_refresh_secret_key_32_chars_min}
      - JWT_ACCESS_EXPIRES_IN=15m
      - JWT_REFRESH_EXPIRES_IN=7d
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000,http://localhost:5173,http://localhost:8080}
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX=500
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - skyfall-network

  mongodb:
    image: mongo:7.0
    container_name: skyfall-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=financial_management
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - skyfall-network

  mongo-express:
    image: mongo-express:1.0.2-20
    container_name: skyfall-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongodb
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_MONGODB_ENABLE_ADMIN=true
      - ME_CONFIG_BASICAUTH_USERNAME=${MONGO_EXPRESS_USER:-admin}
      - ME_CONFIG_BASICAUTH_PASSWORD=${MONGO_EXPRESS_PASS:-skyfalladmin}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - skyfall-network

volumes:
  mongo-data:
    name: skyfall-mongo-data

networks:
  skyfall-network:
    name: skyfall-network
    driver: bridge
