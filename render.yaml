# ========================================================
# Skyfall Financial & Travels ERP System — Render Blueprint
# ========================================================

services:
  - type: web
    name: skyfall-financial-backend
    runtime: node
    plan: starter # Options: free, starter, standard, pro
    region: frankfurt # Options: frankfurt, oregon, ohio, singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false # Set in Render Dashboard with your MongoDB Atlas connection string
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: "*" # Update with your frontend domain(s)
      - key: LOG_LEVEL
        value: info
      - key: GRIDFS_BUCKET
        value: uploads
      - key: MAX_FILE_SIZE_MB
        value: 10
