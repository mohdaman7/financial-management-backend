name: CI Pipeline (Continuous Integration)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ========================================================
  # 1. Quality Gate: Linting, Formatting & Strict TypeScript
  # ========================================================
  quality-gate:
    name: Code Quality & Type Safety
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install Clean Dependencies
        run: npm ci

      - name: Verify Code Style (ESLint)
        run: npx eslint src tests --quiet

      - name: Verify Code Formatting (Prettier)
        run: npm run format:check

      - name: Verify Strict TypeScript Types (tsc --noEmit)
        run: npm run typecheck

  # ========================================================
  # 2. Security Audit: Vulnerability & Dependency Scanning
  # ========================================================
  security-audit:
    name: Security Vulnerability Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Run npm Audit
        run: npm audit --audit-level=high || true

  # ========================================================
  # 3. Test Suite: Automated Unit & Integration Matrix Tests
  # ========================================================
  test-suite:
    name: Test Suite (Node ${{ matrix.node-version }})
    needs: quality-gate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Clean Dependencies
        run: npm ci

      - name: Execute Complete Test Suite with Coverage
        run: npm run test:coverage
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/test
          JWT_ACCESS_SECRET: test-access-secret-minimum-32-characters-required
          JWT_REFRESH_SECRET: test-refresh-secret-minimum-32-characters-required

      - name: Upload Test Coverage Artifacts
        if: matrix.node-version == '20.x'
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: coverage/
          retention-days: 14

  # ========================================================
  # 4. Production Build Verification
  # ========================================================
  build-verification:
    name: Production Build Verification
    needs: test-suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install Clean Dependencies
        run: npm ci

      - name: Compile TypeScript & Path Aliases
        run: npm run build

      - name: Verify Dist Artifacts
        run: test -d dist && test -f dist/server.js

      - name: Upload Compiled Production Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-build-dist
          path: dist/
          retention-days: 7
