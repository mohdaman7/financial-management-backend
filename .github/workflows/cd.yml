name: CD Pipeline (Continuous Deployment)

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # ========================================================
  # 1. Containerization & Registry Publishing
  # ========================================================
  build-and-push-docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - name: Build and Push Production Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ========================================================
  # 2. Automated Production Deployment
  # ========================================================
  deploy-production:
    name: Deploy to Production Environment
    needs: build-and-push-docker
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Webhook Deployment (Render / Railway / Cloud)
        if: env.RENDER_DEPLOY_HOOK != '' || env.WEBHOOK_URL != ''
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
        run: |
          TARGET_URL="${RENDER_DEPLOY_HOOK:-$WEBHOOK_URL}"
          if [ -n "$TARGET_URL" ]; then
            echo "Triggering automated cloud deployment webhook..."
            curl -X POST -f "$TARGET_URL" || echo "Deployment webhook signaled."
          else
            echo "No deployment webhook configured. Skipping cloud trigger."
          fi

      - name: SSH Remote Server Deployment (VPS / Self-Hosted)
        if: env.SSH_HOST != ''
        env:
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          APP_DIR: ${{ secrets.DEPLOY_APP_DIR || '/var/www/skyfall-financial-api' }}
        run: |
          if [ -n "$SSH_HOST" ] && [ -n "$SSH_KEY" ]; then
            echo "Executing zero-downtime remote deployment via SSH..."
            mkdir -p ~/.ssh
            echo "$SSH_KEY" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

            ssh "$SSH_USER@$SSH_HOST" "
              cd $APP_DIR && \
              git pull origin main && \
              docker compose -f docker-compose.prod.yml pull && \
              docker compose -f docker-compose.prod.yml up -d --remove-orphans || \
              (npm ci --only=production && pm2 reload ecosystem.config.js --env production)
            "
          else
            echo "SSH credentials not configured. Skipping SSH deployment."
          fi

  # ========================================================
  # 3. Post-Deployment Smoke Test & Health Check
  # ========================================================
  smoke-test:
    name: Post-Deployment Smoke Test
    needs: deploy-production
    runs-on: ubuntu-latest
    if: env.PRODUCTION_URL != ''
    env:
      PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}

    steps:
      - name: Probe API Health Endpoint
        run: |
          HEALTH_URL="${PRODUCTION_URL}/api/v1/health"
          echo "Probing healthcheck at: $HEALTH_URL"
          for i in {1..6}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Health check PASSED with status 200 OK!"
              exit 0
            fi
            echo "Attempt $i: Received status $STATUS. Retrying in 10 seconds..."
            sleep 10
          done
          echo "Health check failed after 6 attempts."
          exit 1
